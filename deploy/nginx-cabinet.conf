# ============================================================
# Nginx — Reverse proxy Cabinet Traduction Togo
# Fichier à placer dans : /etc/nginx/sites-available/cabinet
# Puis : ln -s /etc/nginx/sites-available/cabinet /etc/nginx/sites-enabled/
# ============================================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.tg www.votre-domaine.tg;

    # Let's Encrypt — ne pas bloquer la validation ACME
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name votre-domaine.tg www.votre-domaine.tg;

    # ── Certificats SSL (générés par Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.tg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ──
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Taille upload (cohérente avec Spring : 55 Mo max) ──
    client_max_body_size 60M;

    # ── Logs ──
    access_log /var/log/nginx/cabinet-access.log;
    error_log  /var/log/nginx/cabinet-error.log;

    # ── Reverse proxy vers Spring Boot ──
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Compression
        proxy_set_header   Accept-Encoding "";
    }

    # ── Ressources statiques — cache long ──
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff|woff2|ttf)$ {
        proxy_pass       http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public, immutable";
    }

    # ── Actuator — accessible uniquement en local ──
    location /actuator {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
