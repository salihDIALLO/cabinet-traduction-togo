<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">

      <div class="text-center mb-4">
        <div style="font-size:4rem; margin-bottom:1rem;">⚠️</div>
        <h2 class="section-title" style="font-size:1.8rem;">Lien expiré ou invalide</h2>
      </div>

      <div class="card border-0 shadow-sm" style="border-radius:16px; overflow:hidden;">
        <div style="background:var(--red); height:4px;"></div>
        <div style="padding:2rem 1.75rem; text-align:center;">

          <!-- Message d'erreur humain (aucun détail technique) -->
          <p style="font-size:1rem; color:var(--t); line-height:1.65; margin-bottom:1.5rem;"
             th:text="${messageErreur}">
            Ce lien est invalide ou a expiré.
          </p>

          <p style="font-size:.88rem; color:var(--tm); margin-bottom:1.75rem;">
            Contactez notre équipe pour obtenir un nouveau lien de téléchargement.
            Nous vous répondrons dans les meilleurs délais.
          </p>

          <!-- Boutons de contact -->
          <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
            <a href="https://wa.me/221779078419?text=Bonjour%2C+mon+lien+de+t%C3%A9l%C3%A9chargement+a+expir%C3%A9."
               target="_blank" rel="noopener noreferrer"
               style="background:var(--wa); color:#fff; border-radius:50px;
                      padding:.75rem 1.5rem; font-size:.9rem; font-weight:700;
                      text-decoration:none; display:inline-flex; align-items:center; gap:.5rem;">
              💬 Contacter via WhatsApp
            </a>
            <a th:href="@{/}" class="btn-prev-ct">
              ← Retour à l'accueil
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
