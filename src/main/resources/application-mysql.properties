# ── Profil MySQL — Cabinet de Traduction Togo ──
database=mysql

# URL, user et password via variables d'environnement
# En dev local XAMPP : root sans mot de passe, base cabinet_traduction
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cabinet_traduction?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASS:}

# Désactiver le script SQL init (on utilise Flyway)
spring.sql.init.mode=never

# Flyway activé sur ce profil
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# MariaDB : Flyway doit utiliser le driver MySQL (compatible)
spring.flyway.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialect MySQL explicite (Hibernate 7 ne le détecte plus automatiquement en cas d'échec connexion)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
