# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false

# AWS S3
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
cloud.aws.region.static=${AWS_REGION:eu-west-3}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# Spring Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:change_me}
spring.mail.password=${MAIL_PASSWORD:change_me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Upload multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB

# JWT
app.jwt.secret=${JWT_SECRET:change_me_with_a_64_bytes_base64_secret}

# FedaPay
app.fedapay.api-key=${FEDAPAY_API_KEY:change_me}
app.fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:change_me}
app.fedapay.sandbox=true
app.fedapay.callback-url=${FEDAPAY_CALLBACK_URL:https://votre-site.tg/paiement/retour}

# CinetPay (remplace FedaPay)
app.cinetpay.api-key=${CINETPAY_API_KEY}
app.cinetpay.site-id=${CINETPAY_SITE_ID}
app.cinetpay.webhook-secret=${CINETPAY_WEBHOOK_SECRET:}
app.cinetpay.notify-url=${CINETPAY_NOTIFY_URL:https://votre-site.tg/api/paiement/notify}
app.cinetpay.return-url=${CINETPAY_RETURN_URL:https://votre-site.tg/paiement/retour}
app.cinetpay.sandbox=true

# Fournisseur de paiement actif : cinetpay | fedapay
# Changer la valeur pour switcher sans modifier le code
app.paiement.provider=cinetpay

# URL de base du site (utilisée dans les emails pour les liens de téléchargement)
app.base-url=${APP_BASE_URL:http://localhost:8080}
